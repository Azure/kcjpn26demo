apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
# controlplane -----------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: loadgen
  labels:
    app: controlplane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: controlplane
  template:
    metadata:
      labels:
        app: controlplane
    spec:
      # Pin to the dedicated `workload` Karpenter NodePool (see nodepools.yaml):
      # nodeSelector keeps these pods off the System/default pools, and the toleration
      # allows them onto the workload pool's tainted nodes.
      nodeSelector:
        workload: apps
      tolerations:
        - key: workload
          operator: Equal
          value: apps
          effect: NoSchedule
      containers:
        - name: controlplane
          image: mcr.microsoft.com/azurelinux/busybox:1.36
          # Time-synchronized load wave: every pod reads the same wall clock, so cluster CPU
          # demand ramps UP then DOWN over PERIOD seconds. That drives the HPA to scale out on
          # the way up and scale in on the way down (and NAP/Karpenter to add/remove nodes),
          # instead of continuously maxing out. Each service uses a different OFFSET so their
          # peaks are staggered across the period rather than all peaking together.
          command:
            - /bin/sh
            - -c
            - |
              PERIOD=600      # full ramp-up + ramp-down cycle (seconds)
              FRAME=10        # control granularity (seconds)
              OFFSET=0        # phase offset for this service (staggers its peak)
              while true; do
                NOW=$(date +%s)
                POS=$(( (NOW + OFFSET) % PERIOD ))
                HALF=$(( PERIOD / 2 ))
                if [ "$POS" -lt "$HALF" ]; then
                  DUTY=$(( POS * 100 / HALF ))          # ramp up 0 -> 100%
                else
                  DUTY=$(( (PERIOD - POS) * 100 / HALF ))  # ramp down 100 -> 0%
                fi
                BUSY=$(( FRAME * DUTY / 100 ))
                END=$(( NOW + BUSY ))
                while [ "$(date +%s)" -lt "$END" ]; do :; done
                IDLE=$(( FRAME - BUSY ))
                [ "$IDLE" -gt 0 ] && sleep "$IDLE"
              done
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: controlplane
  namespace: loadgen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: controlplane
  minReplicas: 1
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60

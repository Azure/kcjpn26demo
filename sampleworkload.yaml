# backgroundprocessor ----------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backgroundprocessor
  namespace: loadgen
  labels:
    app: backgroundprocessor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backgroundprocessor
  template:
    metadata:
      labels:
        app: backgroundprocessor
    spec:
      nodeSelector:
        workload: apps
      tolerations:
        - key: workload
          operator: Equal
          value: apps
          effect: NoSchedule
      containers:
        - name: backgroundprocessor
          image: mcr.microsoft.com/azurelinux/busybox:1.36
          # See controlplane for how this wave works; OFFSET staggers this service's peak.
          command:
            - /bin/sh
            - -c
            - |
              PERIOD=600      # full cycle (seconds)
              FRAME=10        # control granularity (seconds)
              OFFSET=300      # phase offset for this service (staggers its peak)
              GREEN=360       # steady low-load "green" hold each cycle (seconds)
              MAXDUTY=70      # peak busy fraction; stays below full saturation to avoid sustained red
              MEMMIB=256      # memory balloon size (MiB); exceeds the 128Mi limit -> OOMKill
              while true; do
                NOW=$(date +%s)
                POS=$(( (NOW + OFFSET) % PERIOD ))
                # Once per cycle, at the load crest, balloon memory past the container limit. The
                # kernel OOM-kills this shell (container PID 1); the container then restarts and
                # recovers, so backgroundprocessor flips red (pods briefly not Running) for a few
                # minutes each cycle due to memory pressure, rather than being permanently red.
                if [ "$POS" -ge 480 ] && [ "$POS" -lt 490 ]; then
                  CHUNK=$(head -c 1048576 /dev/zero | tr '\0' 'a')  # 1 MiB block
                  i=0
                  while [ "$i" -lt "$MEMMIB" ]; do
                    BALLOON="$BALLOON$CHUNK"
                    i=$(( i + 1 ))
                  done
                fi
                if [ "$POS" -lt "$GREEN" ]; then
                  DUTY=5                                    # steady low load -> healthy/green
                else
                  RAMP=$(( PERIOD - GREEN ))
                  RPOS=$(( POS - GREEN ))
                  HALF=$(( RAMP / 2 ))
                  if [ "$RPOS" -lt "$HALF" ]; then
                    DUTY=$(( RPOS * MAXDUTY / HALF ))       # ramp up 0 -> MAXDUTY
                  else
                    DUTY=$(( (RAMP - RPOS) * MAXDUTY / HALF ))  # ramp down MAXDUTY -> 0
                  fi
                fi
                BUSY=$(( FRAME * DUTY / 100 ))
                END=$(( NOW + BUSY ))
                while [ "$(date +%s)" -lt "$END" ]; do :; done
                IDLE=$(( FRAME - BUSY ))
                [ "$IDLE" -gt 0 ] && sleep "$IDLE"
              done
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backgroundprocessor
  namespace: loadgen
spec:

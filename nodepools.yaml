# Karpenter NodePool + AKSNodeClass for Node Auto-Provisioning (NAP).
#
# NAP's built-in `default` / `system-surge` NodePools are DISABLED on this cluster
# (`nodeProvisioningProfile.defaultNodePools: 'None'` in modules/aks.bicep), so this file
# defines the only Karpenter NodePool the cluster uses: a dedicated, tainted `workload`
# pool that runs the sample workload (sampleworkload.yaml) on its own Azure Linux nodes,
# isolated from the System pool. Apply it with:
#
#   kubectl apply -f nodepools.yaml
#
# The `workload` NodePool uses the self-managed `workload` AKSNodeClass defined at the
# bottom of this file (imageFamily: AzureLinux, encryption-at-host off).
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workload
spec:
  # Prefer this pool over `default` (weight 0) when a pod tolerates the taint below.
  weight: 20
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    metadata:
      # Nodes provisioned by this pool carry this label; the sample workload pins to it
      # with `nodeSelector: { workload: apps }` so it can only land here.
      labels:
        workload: apps
        # Required so Karpenter/NAP correctly predicts the Cilium DaemonSet overhead on
        # this cluster (Azure CNI overlay + Cilium dataplane); otherwise nodes can be
        # sized too small. See Azure/karpenter-provider-azure examples.
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: workload
      expireAfter: Never
      # Taint the nodes so only pods that explicitly tolerate `workload=apps` schedule here.
      taints:
        - key: workload
          value: apps
          effect: NoSchedule
      # Cilium startup taint: keep pods off the node until the Cilium agent is ready.
      # Karpenter/NAP removes it automatically once the dataplane comes up.
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          effect: NoExecute
          value: "true"
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
            - arm64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: karpenter.azure.com/sku-family
          operator: In
          values:
            - D
            - E
            - F
  limits:
    cpu: "100"
    memory: 200Gi
---
# Self-managed node class for the workload pool. Setting imageFamily: AzureLinux makes
# NAP provision Azure Linux nodes (the NAP auto-created `default` class is Ubuntu).
# Omitting vnetSubnetID makes it use the cluster's default node subnet.
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: workload
  annotations:
    kubernetes.io/description: 'Workload node class running Azure Linux nodes'
spec:
  imageFamily: AzureLinux
  security:
    # Do NOT use encryption at host: the subscription hasn't registered the
    # Microsoft.Compute/EncryptionAtHost feature, so requesting it makes the VM
    # create fail with 400 InvalidParameter. Explicitly disable it here.
    encryptionAtHost: false
